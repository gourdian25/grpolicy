version: 2

project_name: grpolicy

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  # Library project — no binaries (example/ is a demo program, not a
  # shipped CLI tool).
  - skip: true

archives:
  - id: source
    # Not tied to any build — the only build above is skipped (pure
    # library, no binary), so without meta:true this archive silently
    # produces nothing (confirmed pattern from grcache/graudit's own
    # .goreleaser.yaml).
    meta: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_src"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - go.mod
      - go.sum
      # Both patterns are needed: "**/*.go" only matches files at least one
      # directory deep, so root-level files like eval.go/engine.go/errors.go
      # need "*.go" too.
      - "*.go"
      - "**/*.go"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release:
  github:
    owner: gourdian25
    name: grpolicy
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Version }}"
  header: |
    ## {{ .ProjectName }} {{ .Version }}

    Standalone attribute-based policy/expression evaluation engine for the gourdian ecosystem.

    ### Highlights
    - Boolean/comparison/string/membership operators plus custom function registration
    - A tree-walking evaluator (not expr-lang/expr's own Run/VM) purpose-built for explainability
    - Decision.Trace shows the full expression shape, including short-circuited branches
    - Fail-loud on missing attributes and type mismatches — no silent coercion
    - Compile-time complexity limits and a bounded, concurrency-safe compiled-policy cache
    - Fuzz-tested evaluator (FuzzCompileEvaluate) with zero crashes across 40M+ executions

    See [CHANGELOG.md](https://github.com/gourdian25/grpolicy/blob/master/CHANGELOG.md) for full details.

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^build:'
      - '^refactor:'
      - '^style:'
      - README
      - Merge pull request
